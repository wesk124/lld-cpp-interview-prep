name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.compiler }} / C++11
    env:
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure reference solutions
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLLD_ENABLE_SANITIZERS=ON -DLLD_WARNINGS_AS_ERRORS=ON
      - name: Build all nine examples
        run: cmake --build build --parallel 2
      - name: Test all reference solutions
        run: ctest --test-dir build --output-on-failure
      - name: Compile all independent TODO starters
        run: |
          for example in questions/[0-9]*; do
            slug="${example##*/}"
            cmake -S . -B build-practice -DLLD_PRACTICE_EXAMPLE="$slug" -DLLD_WARNINGS_AS_ERRORS=ON
            cmake --build build-practice --target practice_tests --parallel 2
          done
